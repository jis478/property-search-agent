<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: { 'fade-in': 'fadeIn 0.4s ease-out forwards' },
                    keyframes: {
                        fadeIn: {
                            '0%':   { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-white border-b border-gray-200 px-4 py-4">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-xl font-bold text-green-600">Property Search</h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
        <section class="bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col" style="height:460px">
            <div id="chat-log" class="flex-1 px-4 py-3 space-y-3 overflow-y-auto bg-white"></div>

            <div id="status-bar" class="hidden border-t border-gray-100 bg-gray-50 px-4 py-2 space-y-1">
                <div id="banner" class="hidden text-xs text-green-800 font-medium animate-pulse"></div>
                <div id="step-log" class="hidden max-h-24 overflow-y-auto space-y-0.5 font-mono text-xs text-gray-600"></div>
                <div id="error-banner" class="hidden text-xs text-red-700"></div>
            </div>

            <form id="chat-form" class="border-t border-gray-100 px-3 py-3 flex gap-2 bg-white rounded-b-xl">
                <input
                    id="chat-input"
                    type="text"
                    placeholder="Ask me anything, e.g. &quot;Find a 2 bedroom apartment in Richmond under $600/week&quot;"
                    class="flex-1 rounded-lg border border-gray-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-green-500"
                />
                <button
                    id="send-btn"
                    type="submit"
                    class="flex items-center gap-2 bg-green-600 text-white rounded-lg px-5 py-3 font-medium hover:bg-green-700 disabled:opacity-50 transition-colors"
                >
                    <svg id="spinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
                    Send
                </button>
            </form>
        </section>
    </main>

    <section id="results-section" class="hidden max-w-5xl mx-auto px-4 pb-12 space-y-4">
        <div id="results-warning" class="hidden rounded-lg bg-amber-50 border border-amber-200 px-4 py-3 text-amber-700 text-sm"></div>
        <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        <div id="no-results" class="hidden text-center text-gray-500 py-12 text-base">No listings found. Try broadening your search.</div>
    </section>

    <script>
        window.GOOGLE_MAPS_EMBED_KEY = {{ (google_maps_api_key or '') | tojson }};
        const form           = document.getElementById('chat-form');
        const chatInput      = document.getElementById('chat-input');
        const sendBtn        = document.getElementById('send-btn');
        const spinner        = document.getElementById('spinner');
        const chatLog        = document.getElementById('chat-log');
        const statusBar      = document.getElementById('status-bar');
        const banner         = document.getElementById('banner');
        const stepLog        = document.getElementById('step-log');
        const errorBanner    = document.getElementById('error-banner');
        const resultsSection = document.getElementById('results-section');
        const resultsWarning = document.getElementById('results-warning');
        const cardGrid       = document.getElementById('card-grid');
        const noResults      = document.getElementById('no-results');

        // Full conversation history sent to /chat on every turn.
        // Includes user, assistant, assistant+tool_calls, and tool messages
        // so the LLM can reference previous search results.
        let messages   = [];
        let currentEs  = null;
        let lastStepEl = null;

        // Pending tool_call from the last /chat response —
        // used to link the SSE result back as a ToolMessage.
        let pendingToolCall = null;

        // ── Helpers ───────────────────────────────────────────────────────────
        function esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function safeUrl(url) {
            if (!url) return null;
            return String(url).startsWith('https://') ? url : null;
        }

        function appendBubble(role, text) {
            if (!text) return;
            const row = document.createElement('div');
            row.className = 'flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
            const bubble = document.createElement('div');
            const base = 'max-w-[80%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap ';
            bubble.className = base + (role === 'user'
                ? 'bg-green-600 text-white'
                : 'bg-gray-100 text-gray-900');
            bubble.textContent = String(text);
            row.appendChild(bubble);
            chatLog.appendChild(row);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // ── UI state ──────────────────────────────────────────────────────────
        function setBusy(label) {
            chatInput.disabled  = true;
            sendBtn.disabled    = true;
            spinner.classList.remove('hidden');
            if (label) {
                banner.textContent = label;
                banner.classList.remove('hidden');
            }
            stepLog.innerHTML = '';
            stepLog.classList.remove('hidden');
            errorBanner.classList.add('hidden');
            statusBar.classList.remove('hidden');
        }

        function setIdle() {
            chatInput.disabled  = false;
            sendBtn.disabled    = false;
            spinner.classList.add('hidden');
            banner.classList.add('hidden');
            stepLog.classList.add('hidden');
            errorBanner.classList.add('hidden');
            statusBar.classList.add('hidden');
            chatInput.focus();
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.remove('hidden');
            statusBar.classList.remove('hidden');
            appendBubble('assistant', msg);
            setIdle();
        }

        // ── Step log ──────────────────────────────────────────────────────────
        const TOOL_ICONS = {
            browser_navigate:        '🌐 ',
            browser_wait_for:        '⏳ ',
            browser_get_text:        '📄 ',
            browser_take_screenshot: '📸 ',
        };

        function appendStepLine(tool, label) {
            const el = document.createElement('div');
            el.className = 'flex items-center gap-1.5 py-0.5';
            el.textContent = (TOOL_ICONS[tool] ?? '• ') + (label ?? tool);
            stepLog.appendChild(el);
            stepLog.scrollTop = stepLog.scrollHeight;
            lastStepEl = el;
        }

        function appendTickToPreviousLine(success) {
            if (!lastStepEl) return;
            const tick = document.createElement('span');
            tick.textContent = success ? ' ✓' : ' ✗';
            tick.className   = success ? 'text-green-600' : 'text-red-500';
            lastStepEl.appendChild(tick);
        }

        // ── Error messages ────────────────────────────────────────────────────
        const ERROR_MESSAGES = {
            BotDetectedError: 'Domain.com.au blocked the search. Try again in a moment.',
            StepLimitError:   'The search took too long. Try a more specific query.',
            MCPError:         'Something went wrong. Check the server is running.',
            UnknownError:     'Something went wrong. Check the server is running.',
            connection:       'Lost connection to the server. Please try again.',
        };

        // ── Card rendering ────────────────────────────────────────────────────
        function buildCardHTML(listing, schoolAddress) {
            const price = listing.price
                ? `<p class="text-green-600 text-lg font-semibold">${esc(listing.price)}</p>`
                : `<p class="text-gray-400 text-sm italic">Price on application</p>`;
            const metaParts = [];
            if (listing.bedrooms  != null) metaParts.push(`${esc(String(listing.bedrooms))} bed`);
            if (listing.bathrooms != null) metaParts.push(`${esc(String(listing.bathrooms))} bath`);
            if (listing.property_type)     metaParts.push(esc(listing.property_type));
            if (listing.distance_to_school != null)
                metaParts.push(`${Math.round(listing.distance_to_school)} m walk to school`);
            const meta = metaParts.length
                ? `<p class="text-sm text-gray-500">${metaParts.join(' · ')}</p>` : '';
            const url = safeUrl(listing.listing_url);
            const cta = url
                ? `<a href="${url}" target="_blank" rel="noopener noreferrer"
                      class="mt-auto block text-center border border-green-600 text-green-600
                             rounded-lg px-3 py-2 text-sm font-medium hover:bg-green-50 transition-colors">
                      View on Domain &rarr;</a>` : '';

            let mapBlock = '';
            if (schoolAddress && listing.address) {
                const origin = encodeURIComponent(schoolAddress);
                const dest = encodeURIComponent(listing.address);
                const dirLink = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=walking`;
                mapBlock = `
                    <div class="mt-2">
                        <a href="${dirLink}" target="_blank" rel="noopener noreferrer"
                           class="text-xs text-green-600 hover:underline">View walking route to school</a>
                        ${window.GOOGLE_MAPS_EMBED_KEY
                            ? `<iframe class="mt-1 w-full h-32 rounded border border-gray-200" frameborder="0" style="border:0"
                                src="https://www.google.com/maps/embed/v1/directions?key=${encodeURIComponent(window.GOOGLE_MAPS_EMBED_KEY)}&origin=${origin}&destination=${dest}&mode=walking"></iframe>`
                            : ''}
                    </div>`;
            }

            return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4
                            flex flex-col gap-2 animate-fade-in">
                    <p class="font-semibold text-gray-900 leading-snug">${esc(listing.address)}</p>
                    ${price}${meta}${mapBlock}${cta}
                </div>`;
        }

        function renderResults(data) {
            setIdle();
            resultsSection.classList.remove('hidden');
            cardGrid.innerHTML = '';
            noResults.classList.add('hidden');
            resultsWarning.classList.add('hidden');

            if (data.partial) {
                resultsWarning.textContent = 'Some results may be incomplete — Domain.com.au may have partially blocked the search.';
                resultsWarning.classList.remove('hidden');
            }

            if (!data.listings || data.listings.length === 0) {
                cardGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
                commitToolResult(data, 'No listings found.');
                appendBubble('assistant', 'I could not find any listings matching that. Try broadening your criteria.');
                messages.push({ role: 'assistant', content: 'I could not find any listings matching that.' });
                return;
            }

            cardGrid.classList.remove('hidden');
            const schoolAddr = data.school_address || null;
            for (const l of data.listings) {
                cardGrid.insertAdjacentHTML('beforeend', buildCardHTML(l, schoolAddr));
            }
            const n = data.listings.length;
            const summaryText = buildToolResultText(data);
            commitToolResult(data, summaryText);
            const replyText = `I found ${n} listing${n === 1 ? '' : 's'}. See the cards below.`;
            appendBubble('assistant', replyText);
            messages.push({ role: 'assistant', content: replyText });
        }

        // ── Tool result helpers ───────────────────────────────────────────────

        function buildToolResultText(data) {
            if (!data.listings || data.listings.length === 0) return 'No listings found.';
            return data.listings.map((l, i) =>
                `${i+1}. ${l.address} | price: ${l.price ?? 'N/A'} | beds: ${l.bedrooms ?? '?'} | baths: ${l.bathrooms ?? '?'} | type: ${l.property_type ?? '?'} | url: ${l.listing_url ?? ''}`
            ).join('\n');
        }

        function commitToolResult(data, summaryText) {
            if (!pendingToolCall) return;
            messages.push({
                role: 'tool',
                content: summaryText,
                tool_call_id: pendingToolCall.id,
            });
            pendingToolCall = null;
        }

        function commitToolError(errorMsg) {
            if (!pendingToolCall) return;
            messages.push({
                role: 'tool',
                content: 'Error: ' + errorMsg,
                tool_call_id: pendingToolCall.id,
            });
            pendingToolCall = null;
        }

        // ── SSE subscription ─────────────────────────────────────────────────
        function subscribeToRun(runId) {
            if (currentEs) { currentEs.close(); currentEs = null; }

            setBusy('Searching properties...');

            currentEs = new EventSource('/stream/' + runId);

            currentEs.addEventListener('tool_call', (e) => {
                const d = JSON.parse(e.data);
                appendStepLine(d.tool, d.label);
            });

            currentEs.addEventListener('tool_result', (e) => {
                const d = JSON.parse(e.data);
                appendTickToPreviousLine(d.success);
            });

            currentEs.addEventListener('complete', (e) => {
                currentEs.close(); currentEs = null;
                renderResults(JSON.parse(e.data));
            });

            currentEs.addEventListener('error', (e) => {
                if (!currentEs) return;
                currentEs.close(); currentEs = null;
                let msg = ERROR_MESSAGES.UnknownError;
                try {
                    const d = JSON.parse(e.data);
                    msg = ERROR_MESSAGES[d.error_type] ?? msg;
                } catch {}
                commitToolError(msg);
                showError(msg);
            });

            currentEs.onerror = () => {
                if (currentEs) {
                    currentEs.close(); currentEs = null;
                    commitToolError(ERROR_MESSAGES.connection);
                    showError(ERROR_MESSAGES.connection);
                }
            };
        }

        // ── Submit handler ────────────────────────────────────────────────────
        async function handleSubmit(event) {
            event.preventDefault();
            const query = chatInput.value.trim();
            if (!query) return;

            appendBubble('user', query);
            messages.push({ role: 'user', content: query });
            chatInput.value = '';

            setBusy('Thinking...');

            try {
                const res = await fetch('/chat', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ messages }),
                });

                if (!res.ok) {
                    showError(ERROR_MESSAGES.UnknownError);
                    return;
                }

                const data = await res.json();

                // Always show the reply bubble
                if (data.reply) {
                    appendBubble('assistant', data.reply);
                }

                if (data.tool_call) {
                    // LLM wants to call an async tool — store the AI message
                    // with tool_calls so the history is correct for LangChain.
                    messages.push({
                        role: 'assistant',
                        content: data.reply || '',
                        tool_calls: [data.tool_call],
                    });
                    pendingToolCall = data.tool_call;
                    subscribeToRun(data.run_id);
                } else {
                    // Plain reply — no tool involved.
                    messages.push({ role: 'assistant', content: data.reply || '' });
                    setIdle();
                }

            } catch {
                showError(ERROR_MESSAGES.connection);
            }
        }

        form.addEventListener('submit', handleSubmit);

        appendBubble('assistant', 'Hi! I can help you search for properties on domain.com.au. Just tell me what you\'re looking for.');
    </script>

</body>
</html>
